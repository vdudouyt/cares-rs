name: Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout source
        uses: actions/checkout@v4

      # Install Rust (via rustup)
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy
          rustup default 1.100.0

      # Cache Cargo dependencies for faster builds
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build the project
      - name: Build
        run: cargo build

      # Run tests
      - name: Run tests
        run: cargo test

      # Lint gate: zero warnings, and the panic-safety wall in src/lib.rs
      # (deny unwrap/expect/panic!/todo!/unimplemented!/unreachable! outside
      # cfg(test)) only binds under clippy — so clippy must run in CI.
      - name: Clippy (zero warnings + panic-safety wall)
        run: cargo clippy --all-targets -- -D warnings

      # ABI + unsafe-surface gates:
      #  - the cbindgen-generated header must match the committed baseline
      #  - the .so's ares_* export set must match the committed baseline
      #  - unsafe-context lines must not grow past the ratchet baseline
      #    (logic belongs in forbid(unsafe_code) kernels; see tools/unsafe_lines.py)
      - name: ABI + unsafe-ratchet gates
        run: |
          diff ci-data/ares.h.baseline include/ares.h
          # LC_ALL=C on both sides: sort order must not depend on the runner's
          # locale (the baseline is committed in C collation).
          nm -D --defined-only target/debug/libcares.so \
            | awk '$2=="T" && $3 ~ /^ares_/ {print $3}' | LC_ALL=C sort \
            | diff <(LC_ALL=C sort ci-data/exports.baseline) -
          python3 tools/unsafe_lines.py --check tools/unsafe_baseline.json

  # Re-entrancy bugs can be invisible at -O0: the release optimiser is allowed
  # to assume `&mut` uniqueness across a poll, even though a C callback may
  # re-enter the channel through its raw pointer. Keep a release-mode run so
  # aliasing/stale-pointer regressions are caught before a tag build.
  release-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Run tests (release)
        run: cargo test --release
