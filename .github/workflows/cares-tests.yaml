name: Integration Tests

on:
  push:
  pull_request:

jobs:
  cares-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc-ares-dev libgtest-dev libgmock-dev cmake
      - name: Build Rust library
        run: cargo build --release
      - name: Build C++ tests
        working-directory: tests/cares-tests
        run: cmake . && make
      - name: Run integration tests
        working-directory: tests/cares-tests
        run: ./arestest ../../target/release/libcares_rs.so
      - name: Run fuzz corpus (DNS parsing)
        working-directory: tests/cares-tests
        run: |
          ls fuzzinput/ | wc -l
          ./aresfuzz ../../target/release/libcares_rs.so fuzzinput/*
          echo "aresfuzz completed successfully"
      - name: Run fuzz corpus (server CSV)
        working-directory: tests/cares-tests
        run: |
          ls fuzznames/ | wc -l
          ./aresfuzzname ../../target/release/libcares_rs.so fuzznames/*
          echo "aresfuzzname completed successfully"
