[package]
name = "cares-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
arrayvec = "0.7"
bytes = "1.10.1"
libc = "0.2.175"
rand = "0.8.0"

[dev-dependencies]
libloading = "0.8.9"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "req100k"
harness = false

[profile.release]
lto = true
codegen-units = 1
